<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIKELO · coming soon</title>
<meta name="description" content="Aikelo komt eraan. Kleding uit eigen schetsen, made to live in.">
<meta name="theme-color" content="#F2EFE9">
<meta property="og:title" content="AIKELO · coming soon">
<meta property="og:description" content="Aikelo komt eraan. Kleding uit eigen schetsen, made to live in.">
<meta property="og:type" content="website">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F2EFE9; --ink: #111; --muted: #6E6A63; --accent: #5E2B33; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: Jost, system-ui, sans-serif; font-weight: 300; overflow: hidden; }
  .soon { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }

  /* de kleding die rond het logo draait */
  .ell { position: absolute; inset: 0; }
  .orbit { position: absolute; left: 50%; top: 50%; width: 0; height: 0; animation: spin 70s linear infinite; }
  .piece { position: absolute; left: 0; top: 0; transform: rotate(var(--a)) translateX(var(--r)) rotate(calc(-1 * var(--a))); }
  .piece img { display: block; width: var(--w); transform: translate(-50%, -50%); animation: spin 70s linear infinite reverse; filter: blur(var(--b)); opacity: .9; }
  .orbit.inner { animation-duration: 95s; animation-direction: reverse; }
  .orbit.inner .piece img { animation-duration: 95s; animation-direction: normal; }
  @keyframes spin { to { rotate: 360deg; } }

  /* midden */
  .center { position: relative; z-index: 2; text-align: center; padding: 0 24px; }
  .center::before { content: ""; position: absolute; inset: -30% -20%; z-index: -1; background: radial-gradient(closest-side, var(--bg) 55%, rgba(242,239,233,0)); }
  .logo { width: clamp(150px, 24vw, 260px); height: auto; display: block; margin: 0 auto; }
  h1 { font-weight: 400; font-size: clamp(44px, 9vw, 120px); line-height: .95; letter-spacing: -.01em; margin: 26px 0 18px; text-transform: lowercase; }
  .quote { font-size: clamp(15px, 1.8vw, 19px); letter-spacing: .32em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .quote b { color: var(--accent); font-weight: 400; }
  .social { margin-top: 34px; display: flex; gap: 22px; justify-content: center; }
  .social a { color: var(--ink); font-size: 12px; letter-spacing: .24em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 3px; }
  .social a:hover { color: var(--accent); }

  /* binnenkomen */
  .center > * { opacity: 0; transform: translateY(14px); animation: up .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .center > :nth-child(2) { animation-delay: .15s; } .center > :nth-child(3) { animation-delay: .3s; } .center > :nth-child(4) { animation-delay: .45s; }
  @keyframes up { to { opacity: 1; transform: none; } }

  /* op een smal scherm een ovale ring, zodat boven en onder ook kleding draait */
  @media (max-width: 700px) { .piece { --r: var(--rm) !important; } .piece img { width: var(--wm); transform: translate(-50%, -50%) scaleY(.57); } .ell { transform: scaleY(1.75); } }
  @media (prefers-reduced-motion: reduce) { .orbit, .piece img { animation: none; } .center > * { animation: none; opacity: 1; transform: none; } }
</style>
</head>
<body>
<main class="soon">
  <div class="ell" aria-hidden="true">
    <div class="orbit" id="outer"></div>
    <div class="orbit inner" id="inner"></div>
  </div>
  <div class="center">
    <img class="logo" src="img/logo.svg" alt="aikelo">
    <h1>coming soon</h1>
    <p class="quote"><b>made</b> to live in</p>
    <div class="social">
      <a href="https://www.instagram.com/aikelo.clothing/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.tiktok.com/@aikelo.clothing" target="_blank" rel="noopener">TikTok</a>
    </div>
  </div>
</main>
<script>
  // buitenste ring: groot en wazig, binnenste ring: kleiner en nog waziger
  var outer = ['ls-echo-groen', 'hoodie-verticaal-navy', 'ls-stuiterend-wit', 'streep-navy', 'ls-echo-bordeaux', 'hoodie-nummer-grijs', 'ls-stempel-navy', 'hoodie-holle-letters-bordeaux'];
  var inner = ['streep-groen', 'hoodie-poster-groen', 'streep-grijs', 'ls-echo-groen', 'hoodie-verticaal-navy'];
  function ring(id, list, r, rm, w, wm, blur, offset) {
    document.getElementById(id).innerHTML = list.map(function (n, i) {
      var a = offset + i * 360 / list.length;
      return '<div class="piece" style="--a:' + a + 'deg;--r:' + r + ';--rm:' + rm + ';--w:' + w + ';--wm:' + wm + ';--b:' + blur + '"><img src="img/p/' + n + '-achter.svg" alt=""></div>';
    }).join('');
  }
  ring('outer', outer, 'min(44vw, 640px)', '62vw', 'clamp(170px, 17vw, 260px)', '150px', '9px', 0);
  ring('inner', inner, 'min(30vw, 400px)', '44vw', 'clamp(110px, 11vw, 170px)', '100px', '13px', 20);
</script>
</body>
</html>
